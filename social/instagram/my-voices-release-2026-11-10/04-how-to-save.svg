<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><radialGradient id="glow" cx="88%" cy="10%" r="75%"><stop offset="0" stop-color="#30411E" stop-opacity=".62"/><stop offset=".5" stop-color="#121912" stop-opacity=".16"/><stop offset="1" stop-color="#0B0F0C" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1350" fill="#0B0F0C"/><rect width="1080" height="1350" fill="url(#glow)"/><g transform="translate(78 70)"><rect width="80" height="80" rx="20" fill="#D9FF63"/><rect x="16" y="27" width="5" height="18" rx="3" fill="#0B0F0C"/><rect x="27" y="18" width="5" height="36" rx="3" fill="#0B0F0C"/><rect x="38" y="10" width="5" height="52" rx="3" fill="#0B0F0C"/><rect x="49" y="18" width="5" height="36" rx="3" fill="#0B0F0C"/><rect x="60" y="27" width="5" height="18" rx="3" fill="#0B0F0C"/></g><text x="184" y="118" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#F5F7F2"><tspan x="184" dy="0">AI VOICE HQ</tspan></text><text x="78" y="218" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#D9FF63"><tspan x="78" dy="0">HOW TO USE IT</tspan></text><text x="1002" y="116" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#AAB3AA"><tspan x="1002" dy="0">04 / 04</tspan></text><text x="78" y="365" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" fill="#F5F7F2"><tspan x="78" dy="0">Four steps. Then it is</tspan><tspan x="78" dy="73.44">ready whenever you are.</tspan></text><circle cx="118" cy="635" r="38" fill="#141A15" stroke="#303A31" stroke-width="2"/><text x="118" y="642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#D9FF63"><tspan x="118" dy="0">01</tspan></text><text x="184" y="630" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#F5F7F2"><tspan x="184" dy="0">Create a new voice</tspan></text><text x="184" y="663" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#AAB3AA"><tspan x="184" dy="0">Upload or record 6–30 seconds.</tspan></text><circle cx="118" cy="755" r="38" fill="#141A15" stroke="#303A31" stroke-width="2"/><text x="118" y="762" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#D9FF63"><tspan x="118" dy="0">02</tspan></text><text x="184" y="750" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#F5F7F2"><tspan x="184" dy="0">Confirm permission</tspan></text><text x="184" y="783" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#AAB3AA"><tspan x="184" dy="0">Only authorized speakers are allowed.</tspan></text><circle cx="118" cy="875" r="38" fill="#141A15" stroke="#303A31" stroke-width="2"/><text x="118" y="882" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#D9FF63"><tspan x="118" dy="0">03</tspan></text><text x="184" y="870" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#F5F7F2"><tspan x="184" dy="0">Name and describe it</tspan></text><text x="184" y="903" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#AAB3AA"><tspan x="184" dy="0">Add language, accent and delivery.</tspan></text><circle cx="118" cy="995" r="38" fill="#D9FF63" stroke="#D9FF63" stroke-width="2"/><text x="118" y="1002" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B0F0C"><tspan x="118" dy="0">04</tspan></text><text x="184" y="990" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#F5F7F2"><tspan x="184" dy="0">Save to My Voices</tspan></text><text x="184" y="1023" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#AAB3AA"><tspan x="184" dy="0">Choose it from Studio anytime.</tspan></text><rect x="78" y="1110" width="924" height="76" rx="18" fill="#D9FF63"/><text x="540" y="1159" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#0B0F0C"><tspan x="540" dy="0">OPEN STUDIO →</tspan></text><line x1="78" y1="1244" x2="1002" y2="1244" stroke="#303A31" stroke-width="2"/><text x="78" y="1292" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#AAB3AA"><tspan x="78" dy="0">AVAILABLE NOW IN STUDIO</tspan></text><text x="1002" y="1292" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#D9FF63"><tspan x="1002" dy="0">AIVOICEGENERATORHQ.COM</tspan></text></svg>